name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build web UI (Astro + Tailwind → static page)
        run: make web
      - name: Test
        run: make test
      - name: Build
        run: make arm64 armv7
      - uses: actions/upload-artifact@v4
        with:
          name: snake-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: webui-${{ github.sha }}
          path: internal/webui/build/site/
          retention-days: 14
