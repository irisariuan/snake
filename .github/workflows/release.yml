name: Release

# Push a tag like v1.2.3 to build and publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
# or run this workflow by hand (Actions → Release → Run workflow) with a
# tag: it is created on the given branch or commit (default main) if it
# does not exist yet, otherwise that tag is rebuilt and republished.
# Routers running snake find it with "Check now" / auto-update.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.2.3 (created if missing)"
        required: true
      ref:
        description: "Branch or commit for a new tag (ignored if the tag exists)"
        required: false
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "bad tag $TAG"; exit 1; }
      - name: Create tag if missing, check it out
        env:
          REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG exists: $(git rev-parse "$TAG^{commit}")"
          else
            commit=$(git rev-parse --verify "origin/$REF^{commit}" 2>/dev/null || git rev-parse --verify "$REF^{commit}")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$commit" -m "snake $TAG"
            # Pushed with the workflow token, so it does not start this
            # workflow a second time.
            git push origin "refs/tags/$TAG"
            echo "created tag $TAG at $commit ($REF)"
          fi
          git checkout -q "$TAG"
      - name: Build web UI (Astro + Tailwind → static page)
        run: make web
      - name: Test
        run: make test
      - name: Build
        run: make arm64 armv7 VERSION="$TAG"
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum snake-arm64 snake-armv7 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/snake-arm64 dist/snake-armv7 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/snake-arm64 dist/snake-armv7 dist/SHA256SUMS \
              --title "snake $TAG" --generate-notes --verify-tag $pre
          fi
